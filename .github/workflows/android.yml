name: Android build (TopoNote)

# Gera o APK do TopoNote V-00 num runner Ubuntu do GitHub (grátis em repositórios públicos).
# Sem segredo KEYSTORE_BASE64 o APK sai assinado com a chave de debug (instala, mas não atualiza
# por cima de uma versão assinada com a chave de produção).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências web
        run: npm ci || npm install

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Importar chave de assinatura (se configurada)
        if: env.HAS_KEYSTORE != ''
        run: echo "$HAS_KEYSTORE" | base64 --decode > android/toponote.jks

      - name: Compilar APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Preparar artefacto
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/TopoNote-V-00.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: TopoNote-APK
          path: dist/*.apk
          if-no-files-found: error
