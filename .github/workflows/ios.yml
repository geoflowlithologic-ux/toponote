name: iOS build (TopoNote)

# Compila o TopoNote V-00 num runner macOS do GitHub, sem precisar de Mac local.
# - Sem segredos: gera um .ipa não assinado (assinar com Sideloadly/AltStore e Apple ID gratuito).
# - Com segredos de assinatura: gera um .ipa assinado (Ad Hoc).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      HAS_CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências web
        run: npm ci || npm install

      - name: Sincronizar Capacitor
        run: npx cap sync ios

      - name: CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Importar certificado de assinatura (se configurado)
        if: env.HAS_CERT != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$P12_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$P12_PASSWORD" "$KEYCHAIN"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$P12_PASSWORD" "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Arquivar
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          ARGS=(archive -workspace App.xcworkspace -scheme App -configuration Release
                -destination 'generic/platform=iOS'
                -archivePath "$RUNNER_TEMP/TopoNote.xcarchive"
                -allowProvisioningUpdates CODE_SIGNING_ALLOWED=NO)
          if [ -n "$TEAM_ID" ]; then ARGS+=(DEVELOPMENT_TEAM="$TEAM_ID"); fi
          xcodebuild "${ARGS[@]}"

      - name: Empacotar .ipa não assinado
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/TopoNote.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qr TopoNote-unsigned.ipa Payload
          cp TopoNote-unsigned.ipa "$GITHUB_WORKSPACE/TopoNote-unsigned.ipa"

      - name: Exportar .ipa assinado
        if: env.HAS_CERT != ''
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TopoNote.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/signed" -allowProvisioningUpdates
          cp "$RUNNER_TEMP/signed/"*.ipa "$GITHUB_WORKSPACE/TopoNote-signed.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: TopoNote-ipa
          path: TopoNote-*.ipa
          if-no-files-found: warn
